; PlatformIO project for the DigiSpark foot controller.
;
; The sketch folder is the PlatformIO source directory, so the same files work
; in the Arduino IDE (open firmware/footcontroller/footcontroller.ino).
;
;   pio run                 build the DigiSpark target
;   pio run -t upload       flash over the micronucleus bootloader
;   pio test -e native      run the host-side debounce tests

[platformio]
src_dir = footcontroller
default_envs = digispark-tiny

[env:digispark-tiny]
platform = atmelavr
board = digispark-tiny
framework = arduino
build_flags = -Wall

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -I${PROJECT_DIR}/footcontroller -std=gnu++11
